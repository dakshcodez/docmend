name: 'docmend - Automated Documentation Healing'
description: 'Detects stale docs from code changes, auto-fixes high-confidence cases, and flags the rest for review.'
inputs:
  gemini-api-key:
    description: 'Gemini API key used for staleness detection and doc repair.'
    required: true
  github-token:
    description: 'Token used to open the auto-fix PR and post the summary comment.'
    required: true
    default: ${{ github.token }}
  confidence-threshold:
    description: 'Minimum confidence (0-1) for a correction to be auto-fixed instead of flagged for review.'
    required: false
    default: '0.8'
  auto-merge:
    description: 'Automatically merge the auto-fix PR docmend opens.'
    required: false
    default: 'false'
outputs:
  stale-sections-found:
    description: 'Number of documentation sections found to be stale for this PR.'
  corrections-generated:
    description: 'Number of corrections generated (auto-fixed plus flagged for review).'
branding:
  icon: 'refresh-cw'
  color: 'blue'
runs:
  using: 'node20'
  main: 'packages/action/dist/index.js'
